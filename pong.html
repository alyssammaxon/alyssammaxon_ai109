<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Arcade</title>
  <style>
    :root {
      --bg: #071827;
      --panel: rgba(8, 30, 49, 0.9);
      --line: rgba(148, 163, 184, 0.28);
      --ink: #e2e8f0;
      --accent: #f59e0b;
      --accent-2: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.22), transparent 35%),
        linear-gradient(180deg, #0b2238, var(--bg));
      display: grid;
      place-items: center;
    }

    .pong-shell {
      width: min(100%, 820px);
      padding: 20px;
    }

    .pong-panel {
      background: var(--panel);
      border: 1px solid rgba(226, 232, 240, 0.12);
      border-radius: 24px;
      box-shadow: 0 24px 50px rgba(2, 12, 27, 0.35);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .title {
      margin: 0;
      font-size: clamp(1.2rem, 2.8vw, 1.7rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .scoreboard {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
    }

    .score-pill {
      min-width: 64px;
      padding: 9px 12px;
      text-align: center;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(226, 232, 240, 0.08);
    }

    .arena {
      padding: 18px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.98));
      border: 1px solid rgba(226, 232, 240, 0.08);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px 18px;
      color: #cbd5e1;
      font-size: 0.94rem;
    }

    .controls strong {
      color: #fff7ed;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #082032;
      background: linear-gradient(135deg, var(--accent), #fbbf24);
    }

    @media (max-width: 620px) {
      .pong-shell {
        padding: 10px;
      }

      .topbar,
      .controls {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="pong-shell">
    <div class="pong-panel">
      <div class="topbar">
        <div>
          <h1 class="title">Pong Arcade</h1>
          <p class="subtitle">Use W/S for the left paddle and arrow keys for the right paddle.</p>
        </div>
        <div class="scoreboard" aria-live="polite">
          <div class="score-pill">Left <span id="left-score">0</span></div>
          <div class="score-pill">Right <span id="right-score">0</span></div>
        </div>
      </div>

      <div class="arena">
        <canvas id="pong" width="760" height="430" aria-label="Pong game board"></canvas>
      </div>

      <div class="controls">
        <div><strong>Controls:</strong> `W` / `S` and `↑` / `↓`</div>
        <button class="btn" id="reset-game" type="button">Reset Score</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("pong");
    const context = canvas.getContext("2d");
    const leftScoreNode = document.getElementById("left-score");
    const rightScoreNode = document.getElementById("right-score");
    const resetButton = document.getElementById("reset-game");

    const paddleHeight = 88;
    const paddleWidth = 12;
    const ballSize = 12;
    const keys = new Set();

    const state = {
      leftScore: 0,
      rightScore: 0,
      leftPaddle: { x: 18, y: canvas.height / 2 - paddleHeight / 2, speed: 5.4 },
      rightPaddle: { x: canvas.width - 30, y: canvas.height / 2 - paddleHeight / 2, speed: 5.4 },
      ball: {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 4.2,
        vy: 2.8
      }
    };

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    const resetBall = (direction = 1) => {
      state.ball.x = canvas.width / 2;
      state.ball.y = canvas.height / 2;
      state.ball.vx = 4.2 * direction;
      state.ball.vy = (Math.random() * 3.2) - 1.6;
    };

    const resetScore = () => {
      state.leftScore = 0;
      state.rightScore = 0;
      leftScoreNode.textContent = "0";
      rightScoreNode.textContent = "0";
      resetBall(Math.random() > 0.5 ? 1 : -1);
    };

    const drawCenterLine = () => {
      context.fillStyle = "rgba(226, 232, 240, 0.35)";

      for (let y = 18; y < canvas.height - 18; y += 24) {
        context.fillRect(canvas.width / 2 - 2, y, 4, 12);
      }
    };

    const draw = () => {
      context.clearRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "#0f172a";
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawCenterLine();

      context.fillStyle = "#f8fafc";
      context.fillRect(state.leftPaddle.x, state.leftPaddle.y, paddleWidth, paddleHeight);
      context.fillRect(state.rightPaddle.x, state.rightPaddle.y, paddleWidth, paddleHeight);

      context.fillStyle = "#38bdf8";
      context.fillRect(state.ball.x, state.ball.y, ballSize, ballSize);
    };

    const updatePaddles = () => {
      if (keys.has("w")) {
        state.leftPaddle.y -= state.leftPaddle.speed;
      }
      if (keys.has("s")) {
        state.leftPaddle.y += state.leftPaddle.speed;
      }
      if (keys.has("ArrowUp")) {
        state.rightPaddle.y -= state.rightPaddle.speed;
      }
      if (keys.has("ArrowDown")) {
        state.rightPaddle.y += state.rightPaddle.speed;
      }

      state.leftPaddle.y = clamp(state.leftPaddle.y, 0, canvas.height - paddleHeight);
      state.rightPaddle.y = clamp(state.rightPaddle.y, 0, canvas.height - paddleHeight);
    };

    const bounceFromPaddle = (paddle, direction) => {
      const ballCenter = state.ball.y + ballSize / 2;
      const paddleCenter = paddle.y + paddleHeight / 2;
      const offset = (ballCenter - paddleCenter) / (paddleHeight / 2);

      state.ball.vx = Math.abs(state.ball.vx) * direction;
      state.ball.vy = offset * 4.8;
    };

    const updateBall = () => {
      state.ball.x += state.ball.vx;
      state.ball.y += state.ball.vy;

      if (state.ball.y <= 0 || state.ball.y + ballSize >= canvas.height) {
        state.ball.vy *= -1;
      }

      const hitsLeftPaddle =
        state.ball.x <= state.leftPaddle.x + paddleWidth &&
        state.ball.y + ballSize >= state.leftPaddle.y &&
        state.ball.y <= state.leftPaddle.y + paddleHeight;

      const hitsRightPaddle =
        state.ball.x + ballSize >= state.rightPaddle.x &&
        state.ball.y + ballSize >= state.rightPaddle.y &&
        state.ball.y <= state.rightPaddle.y + paddleHeight;

      if (hitsLeftPaddle && state.ball.vx < 0) {
        bounceFromPaddle(state.leftPaddle, 1);
      }

      if (hitsRightPaddle && state.ball.vx > 0) {
        bounceFromPaddle(state.rightPaddle, -1);
      }

      if (state.ball.x + ballSize < 0) {
        state.rightScore += 1;
        rightScoreNode.textContent = String(state.rightScore);
        resetBall(-1);
      }

      if (state.ball.x > canvas.width) {
        state.leftScore += 1;
        leftScoreNode.textContent = String(state.leftScore);
        resetBall(1);
      }
    };

    const loop = () => {
      updatePaddles();
      updateBall();
      draw();
      window.requestAnimationFrame(loop);
    };

    window.addEventListener("keydown", (event) => {
      if (["w", "s", "ArrowUp", "ArrowDown"].includes(event.key)) {
        event.preventDefault();
        keys.add(event.key);
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key);
    });

    resetButton.addEventListener("click", resetScore);

    resetScore();
    draw();
    loop();
  </script>
</body>
</html>
